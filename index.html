<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Resume Builder</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

        window.jsPDF = window.jspdf.jsPDF;

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            min-height: calc(100vh - 40px);
        }

        .editor-panel, .preview-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            max-height: calc(100vh - 40px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #edf2f7;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #fc8181, #f56565);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #68d391, #48bb78);
            color: white;
        }

        .section-selector {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .available-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .section-card {
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .section-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .section-card.added {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .resume-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #667eea;
        }

        .section-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
        }

        .entry-item {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 3px solid #667eea;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .preview-resume {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            font-family: 'Georgia', serif;
            line-height: 1.6;
            min-height: 800px;
        }

        .preview-header {
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .preview-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .preview-contact {
            color: #718096;
            font-size: 1rem;
        }

        .preview-section {
            margin-bottom: 30px;
        }

        .preview-section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .preview-entry {
            margin-bottom: 20px;
        }

        .preview-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .preview-entry-title {
            font-weight: bold;
            color: #2d3748;
        }

        .preview-entry-date {
            color: #718096;
            font-style: italic;
        }

        .preview-entry-subtitle {
            color: #4a5568;
            font-style: italic;
            margin-bottom: 8px;
        }

        .preview-entry-description {
            color: #2d3748;
            margin-left: 0;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .skill-item {
            background: #f7fafc;
            padding: 8px 16px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .drag-handle {
            cursor: move;
            color: #a0aec0;
            margin-right: 10px;
        }

        .sortable-ghost {
            opacity: 0.4;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #68d391, #48bb78);
        }

        .notification.error {
            background: linear-gradient(135deg, #fc8181, #f56565);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Editor Panel -->
        <div class="editor-panel">
            <div class="header">
                <h1>Resume Builder</h1>
                <p>Create your professional resume with ease</p>
            </div>

            <!-- Authentication Section -->
            <div id="authSection" class="auth-section">
                <h3>Get Started</h3>
                <div class="form-group">
                    <label>Email (for saving your resume)</label>
                    <input type="email" id="userEmail" placeholder="Enter your email">
                </div>
                <button class="btn btn-primary" onclick="authenticate()">Start Building</button>
                <button class="btn btn-secondary" onclick="loginAsDemoUser()" style="margin-left:10px;">Demo Login</button>
            </div>

            <!-- Main Editor -->
            <div id="editorContent" class="hidden">
                <!-- Section Selector -->
                <div class="section-selector">
                    <h3>Add Resume Sections</h3>
                    <div class="available-sections" id="availableSections"></div>
                </div>

                <!-- Resume Sections -->
                <div id="resumeSections"></div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="saveResume()">💾 Save Resume</button>
                    <button class="btn btn-primary" onclick="exportToPDF()">📄 Export PDF</button>
                    <button class="btn btn-secondary" onclick="loadResume()">📂 Load Resume</button>
                    <button class="btn btn-danger" onclick="clearResume()">🗑️ Clear All</button>
                    <button class="btn btn-secondary" onclick="signOut()">🚪 Sign Out</button>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class="header">
                <h2>Live Preview</h2>
            </div>
            <div id="resumePreview" class="preview-resume">
                <div class="loading">Start building your resume to see the preview</div>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuration (Replace with your actual Supabase credentials)
        const SUPABASE_URL = 'https://gshxpoiqmgxzhlufcenf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzaHhwb2lxbWd4emhsdWZjZW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkwNjAzNDYsImV4cCI6MjA2NDYzNjM0Nn0.VmGKRWUVnZuixLaSBiv62EKMWUj6LkGk_eiOWTVENhE';
        


        document.addEventListener('DOMContentLoaded', async function() {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                console.error('Supabase credentials not found');
                showNotification('Database configuration missing', 'error');
                return;
            }
            await initializeSupabase();
        });

        // // For demo purposes, we'll use localStorage
        // let supabase = null;
        // let currentUser = null;

        // Demo user flag
        let isDemoUser = false;

        // Available resume sections
        const availableSections = {
            personalInfo: {
                title: 'Personal Information',
                icon: '👤',
                required: true,
                fields: [
                    { name: 'fullName', label: 'Full Name', type: 'text', required: true },
                    { name: 'email', label: 'Email', type: 'email', required: true },
                    { name: 'phone', label: 'Phone', type: 'tel', required: true },
                    { name: 'address', label: 'Address', type: 'text' },
                    { name: 'linkedin', label: 'LinkedIn', type: 'url' },
                    { name: 'website', label: 'Website', type: 'url' }
                ]
            },
            summary: {
                title: 'Professional Summary',
                icon: '📝',
                fields: [
                    { name: 'summary', label: 'Summary', type: 'textarea', required: true, placeholder: 'Write a compelling summary of your professional background...' }
                ]
            },
            experience: {
                title: 'Work Experience',
                icon: '💼',
                multiple: true,
                fields: [
                    { name: 'jobTitle', label: 'Job Title', type: 'text', required: true },
                    { name: 'company', label: 'Company', type: 'text', required: true },
                    { name: 'location', label: 'Location', type: 'text' },
                    { name: 'startDate', label: 'Start Date', type: 'month' },
                    { name: 'endDate', label: 'End Date', type: 'month' },
                    { name: 'current', label: 'Currently Working Here', type: 'checkbox' },
                    { name: 'description', label: 'Description', type: 'textarea', placeholder: 'Describe your responsibilities and achievements...' }
                ]
            },
            education: {
                title: 'Education',
                icon: '🎓',
                multiple: true,
                fields: [
                    { name: 'degree', label: 'Degree', type: 'text', required: true },
                    { name: 'school', label: 'School/University', type: 'text', required: true },
                    { name: 'location', label: 'Location', type: 'text' },
                    { name: 'graduationDate', label: 'Graduation Date', type: 'month' },
                    { name: 'gpa', label: 'GPA', type: 'number', step: '0.01', max: '4.0' },
                    { name: 'description', label: 'Additional Details', type: 'textarea' }
                ]
            },
            skills: {
                title: 'Skills',
                icon: '🛠️',
                fields: [
                    { name: 'skills', label: 'Skills (comma-separated)', type: 'textarea', placeholder: 'JavaScript, Python, React, Node.js, SQL...' }
                ]
            },
            projects: {
                title: 'Projects',
                icon: '🚀',
                multiple: true,
                fields: [
                    { name: 'projectName', label: 'Project Name', type: 'text', required: true },
                    { name: 'description', label: 'Description', type: 'textarea' },
                    { name: 'technologies', label: 'Technologies Used', type: 'text' },
                    { name: 'link', label: 'Project Link', type: 'url' }
                ]
            },
            certifications: {
                title: 'Certifications',
                icon: '🏆',
                multiple: true,
                fields: [
                    { name: 'certName', label: 'Certification Name', type: 'text', required: true },
                    { name: 'issuer', label: 'Issuing Organization', type: 'text' },
                    { name: 'date', label: 'Date Obtained', type: 'month' },
                    { name: 'link', label: 'Credential Link', type: 'url' }
                ]
            },
            languages: {
                title: 'Languages',
                icon: '🌍',
                fields: [
                    { name: 'languages', label: 'Languages (format: Language - Proficiency)', type: 'textarea', placeholder: 'English - Native\nSpanish - Fluent\nFrench - Intermediate' }
                ]
            }
        };

        let resumeData = {};
        let addedSections = ['personalInfo']; // Personal info is required

        // Initialize the app
        function initializeApp() {
            renderAvailableSections();
            renderResumeSections();
            updatePreview();
        }

        // Authentication (simplified for demo)
        async function authenticate() {
            const email = document.getElementById('userEmail').value;
            if (!email) {
                showNotification('Please enter your email', 'error');
                return;
            }

            try {
                // Send magic link for authentication
                const { error } = await supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin,
                    }
                });

                if (error) throw error;

                showNotification('Check your email for the login link!', 'success');
                
            } catch (error) {
                console.error('Authentication error:', error);
                showNotification('Authentication failed', 'error');
            }
        }

        // Login as demo user
        function loginAsDemoUser() {
            isDemoUser = true;
            currentUser = { email: 'demo@demo.com', demo: true };
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('editorContent').classList.remove('hidden');
            showNotification('Demo mode activated!', 'success');
            // Load demo resume data if available, else start fresh
            const demoResume = localStorage.getItem('demoResumeData');
            const demoSections = localStorage.getItem('demoAddedSections');
            if (demoResume && demoSections) {
                resumeData = JSON.parse(demoResume);
                addedSections = JSON.parse(demoSections);
            } else {
                resumeData = {};
                addedSections = ['personalInfo'];
            }
            initializeApp();
            updatePreview();
        }

        // Render available sections
        function renderAvailableSections() {
            const container = document.getElementById('availableSections');
            container.innerHTML = '';

            Object.keys(availableSections).forEach(sectionKey => {
                const section = availableSections[sectionKey];
                const isAdded = addedSections.includes(sectionKey);
                
                const sectionCard = document.createElement('div');
                sectionCard.className = `section-card ${isAdded ? 'added' : ''}`;
                sectionCard.innerHTML = `
                    <div style="font-size: 2rem; margin-bottom: 10px;">${section.icon}</div>
                    <div style="font-weight: 600;">${section.title}</div>
                    ${section.required ? '<div style="font-size: 0.8rem; color: #e53e3e;">Required</div>' : ''}
                `;
                
                if (!isAdded && !section.required) {
                    sectionCard.onclick = () => addSection(sectionKey);
                }
                
                container.appendChild(sectionCard);
            });
        }

        // Add a section
        function addSection(sectionKey) {
            if (!addedSections.includes(sectionKey)) {
                addedSections.push(sectionKey);
                if (!resumeData[sectionKey]) {
                    resumeData[sectionKey] = availableSections[sectionKey].multiple ? [{}] : {};
                }
                renderAvailableSections();
                renderResumeSections();
                updatePreview();
            }
        }

        // Remove a section
        function removeSection(sectionKey) {
            if (!availableSections[sectionKey].required) {
                addedSections = addedSections.filter(key => key !== sectionKey);
                delete resumeData[sectionKey];
                renderAvailableSections();
                renderResumeSections();
                updatePreview();
            }
        }

        // Render resume sections
        function renderResumeSections() {
            const container = document.getElementById('resumeSections');
            container.innerHTML = '';

            addedSections.forEach(sectionKey => {
                const section = availableSections[sectionKey];
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'resume-section';
                sectionDiv.innerHTML = `
                    <div class="section-header">
                        <h3 class="section-title">${section.icon} ${section.title}</h3>
                        ${!section.required ? `<button class="btn btn-danger" onclick="removeSection('${sectionKey}')">Remove</button>` : ''}
                    </div>
                    <div id="section-${sectionKey}"></div>
                    ${section.multiple ? `<button class="btn btn-secondary" onclick="addEntry('${sectionKey}')">Add ${section.title.slice(0, -1)}</button>` : ''}
                `;
                container.appendChild(sectionDiv);

                renderSectionContent(sectionKey);
            });
        }

        // Render section content
        function renderSectionContent(sectionKey) {
            const section = availableSections[sectionKey];
            const container = document.getElementById(`section-${sectionKey}`);
            container.innerHTML = '';

            if (section.multiple) {
                const entries = resumeData[sectionKey] || [{}];
                entries.forEach((entry, index) => {
                    const entryDiv = document.createElement('div');
                    entryDiv.className = 'entry-item';
                    entryDiv.innerHTML = `
                        <div class="entry-header">
                            <h4>Entry ${index + 1}</h4>
                            <button class="btn btn-danger" onclick="removeEntry('${sectionKey}', ${index})">Remove</button>
                        </div>
                        <div id="entry-${sectionKey}-${index}"></div>
                    `;
                    container.appendChild(entryDiv);

                    renderFields(section.fields, `entry-${sectionKey}-${index}`, entry, (field, value) => {
                        if (!resumeData[sectionKey]) resumeData[sectionKey] = [];
                        if (!resumeData[sectionKey][index]) resumeData[sectionKey][index] = {};
                        resumeData[sectionKey][index][field] = value;
                        updatePreview();
                    });
                });
            } else {
                const data = resumeData[sectionKey] || {};
                renderFields(section.fields, container.id, data, (field, value) => {
                    if (!resumeData[sectionKey]) resumeData[sectionKey] = {};
                    resumeData[sectionKey][field] = value;
                    updatePreview();
                });
            }
        }

        // Render form fields
        function renderFields(fields, containerId, data, onUpdate) {
            const container = typeof containerId === 'string' 
                ? document.getElementById(containerId) 
                : containerId;

            fields.forEach(field => {
                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';

                let input;
                if (field.type === 'textarea') {
                    input = `<textarea id="${containerId}-${field.name}" placeholder="${field.placeholder || ''}">${data[field.name] || ''}</textarea>`;
                } else if (field.type === 'checkbox') {
                    input = `<input type="checkbox" id="${containerId}-${field.name}" ${data[field.name] ? 'checked' : ''}>`;
                } else {
                    const attrs = [];
                    if (field.required) attrs.push('required');
                    if (field.step) attrs.push(`step="${field.step}"`);
                    if (field.max) attrs.push(`max="${field.max}"`);
                    
                    input = `<input type="${field.type}" id="${containerId}-${field.name}" value="${data[field.name] || ''}" placeholder="${field.placeholder || ''}" ${attrs.join(' ')}>`;
                }

                formGroup.innerHTML = `
                    <label for="${containerId}-${field.name}">${field.label}</label>
                    ${input}
                `;

                container.appendChild(formGroup);

                // Add event listener
                const inputElement = document.getElementById(`${containerId}-${field.name}`);
                inputElement.addEventListener('input', (e) => {
                    const value = field.type === 'checkbox' ? e.target.checked : e.target.value;
                    onUpdate(field.name, value);
                });
            });
        }

        // Add entry for multiple sections
        function addEntry(sectionKey) {
            if (!resumeData[sectionKey]) resumeData[sectionKey] = [];
            resumeData[sectionKey].push({});
            renderSectionContent(sectionKey);
            updatePreview();
        }

        // Remove entry from multiple sections
        function removeEntry(sectionKey, index) {
            if (resumeData[sectionKey] && resumeData[sectionKey].length > 1) {
                resumeData[sectionKey].splice(index, 1);
                renderSectionContent(sectionKey);
                updatePreview();
            }
        }

        // Update live preview
        function updatePreview() {
            const preview = document.getElementById('resumePreview');
            
            if (Object.keys(resumeData).length === 0) {
                preview.innerHTML = '<div class="loading">Start building your resume to see the preview</div>';
                return;
            }

            let html = '';

            // Header
            const personalInfo = resumeData.personalInfo || {};
            html += `
                <div class="preview-header">
                    <div class="preview-name">${personalInfo.fullName || 'Your Name'}</div>
                    <div class="preview-contact">
                        ${personalInfo.email || ''} ${personalInfo.phone ? '• ' + personalInfo.phone : ''}
                        ${personalInfo.address ? '• ' + personalInfo.address : ''}
                        ${personalInfo.linkedin ? '• LinkedIn: ' + personalInfo.linkedin : ''}
                        ${personalInfo.website ? '• ' + personalInfo.website : ''}
                    </div>
                </div>
            `;

            // Sections
            addedSections.forEach(sectionKey => {
                if (sectionKey === 'personalInfo' || !resumeData[sectionKey]) return;

                const section = availableSections[sectionKey];
                const data = resumeData[sectionKey];

                html += `<div class="preview-section">`;
                html += `<h3 class="preview-section-title">${section.title}</h3>`;

                if (sectionKey === 'summary') {
                    html += `<div class="preview-entry-description">${data.summary || ''}</div>`;
                } else if (sectionKey === 'skills') {
                    const skills = (data.skills || '').split(',').map(s => s.trim()).filter(s => s);
                    html += `<div class="skills-grid">`;
                    skills.forEach(skill => {
                        html += `<div class="skill-item">${skill}</div>`;
                    });
                    html += `</div>`;
                } else if (sectionKey === 'languages') {
                    const languages = (data.languages || '').split('\n').filter(l => l.trim());
                    languages.forEach(lang => {
                        html += `<div class="preview-entry-description">${lang}</div>`;
                    });
                } else if (Array.isArray(data)) {
                    data.forEach(entry => {
                        html += `<div class="preview-entry">`;
                        
                        if (sectionKey === 'experience') {
                            html += `
                                <div class="preview-entry-header">
                                    <div class="preview-entry-title">${entry.jobTitle || ''}</div>
                                    <div class="preview-entry-date">${entry.startDate || ''} - ${entry.current ? 'Present' : entry.endDate || ''}</div>
                                </div>
                                <div class="preview-entry-subtitle">${entry.company || ''} ${entry.location ? '• ' + entry.location : ''}</div>
                                <div class="preview-entry-description">${entry.description || ''}</div>
                            `;
                        } else if (sectionKey === 'education') {
                            html += `
                                <div class="preview-entry-header">
                                    <div class="preview-entry-title">${entry.degree || ''}</div>
                                    <div class="preview-entry-date">${entry.graduationDate || ''}</div>
                                </div>
                                <div class="preview-entry-subtitle">${entry.school || ''} ${entry.location ? '• ' + entry.location : ''}</div>
                                ${entry.gpa ? `<div class="preview-entry-description">GPA: ${entry.gpa}</div>` : ''}
                                <div class="preview-entry-description">${entry.description || ''}</div>
                            `;
                        } else if (sectionKey === 'projects') {
                            html += `
                                <div class="preview-entry-header">
                                    <div class="preview-entry-title">${entry.projectName || ''}</div>
                                    ${entry.link ? `<div><a href="${entry.link}" target="_blank">View Project</a></div>` : ''}
                                </div>
                                <div class="preview-entry-description">${entry.description || ''}</div>
                                ${entry.technologies ? `<div class="preview-entry-subtitle">Technologies: ${entry.technologies}</div>` : ''}
                            `;
                        } else if (sectionKey === 'certifications') {
                            html += `
                                <div class="preview-entry-header">
                                    <div class="preview-entry-title">${entry.certName || ''}</div>
                                    <div class="preview-entry-date">${entry.date || ''}</div>
                                </div>
                                <div class="preview-entry-subtitle">${entry.issuer || ''}</div>
                                ${entry.link ? `<div><a href="${entry.link}" target="_blank">View Credential</a></div>` : ''}
                            `;
                        }
                        
                        html += `</div>`;
                    });
                }

                html += `</div>`;
            });

            preview.innerHTML = html;
        }

        // Save resume to localStorage (demo) or Supabase
        async function saveResume() {
            if (!currentUser) {
                showNotification('Please authenticate first', 'error');
                return;
            }

            if (isDemoUser) {
                localStorage.setItem('demoResumeData', JSON.stringify(resumeData));
                localStorage.setItem('demoAddedSections', JSON.stringify(addedSections));
                showNotification('Demo resume saved locally', 'success');
                return;
            }

            if (!supabase) {
                showNotification('Database connection not initialized', 'error');
                return;
            }

            try {
                const resumeToSave = {
                    user_email: currentUser.email,
                    resume_data: resumeData,
                    added_sections: addedSections,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                const { data, error } = await supabase
                    .from('resumes')
                    .upsert(resumeToSave, { 
                        onConflict: 'user_email',
                        returning: 'minimal' 
                    });
                
                if (error) throw error;

                showNotification('Resume saved successfully', 'success');
            } catch (error) {
                console.error('Error saving resume:', error);
                showNotification('Error saving resume', 'error');
            }
        }

        // Load resume from Supabase or localStorage (demo)
        async function loadResume() {
            if (!currentUser) {
                showNotification('Please authenticate first', 'error');
                return;
            }

            if (isDemoUser) {
                const demoResume = localStorage.getItem('demoResumeData');
                const demoSections = localStorage.getItem('demoAddedSections');
                if (demoResume && demoSections) {
                    resumeData = JSON.parse(demoResume);
                    addedSections = JSON.parse(demoSections);
                    renderAvailableSections();
                    renderResumeSections();
                    updatePreview();
                    showNotification('Demo resume loaded from local storage', 'success');
                } else {
                    showNotification('No demo resume found', 'error');
                }
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('resumes')
                    .select('resume_data, added_sections')
                    .eq('user_email', currentUser.email)
                    .single();
                
                if (error) throw error;

                resumeData = data.resume_data;
                addedSections = data.added_sections;

                renderAvailableSections();
                renderResumeSections();
                updatePreview();

                showNotification('Resume loaded successfully', 'success');
            } catch (error) {
                console.error('Error loading resume:', error);
                showNotification('Error loading resume', 'error');
            }
        }

        // Clear resume data
        function clearResume() {
            if (confirm('Are you sure you want to clear all resume data?')) {
                resumeData = {};
                addedSections = ['personalInfo'];
                renderAvailableSections();
                renderResumeSections();
                updatePreview();
                showNotification('Resume data cleared', 'success');
            }
        }

        // Export resume to PDF
        function exportToPDF() {
            const element = document.getElementById('resumePreview');
            html2canvas(element, { 
                scale: 2,
                logging: false,
                useCORS: true
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'pt',
                    format: 'a4'
                });
                
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('resume.pdf');
            });
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerText = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('show');
            }, 10);

            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Initialize Supabase
        async function initializeSupabase() {
            try {
                // Create Supabase client correctly using the global supabaseClient
                supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Get initial session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw sessionError;

                // Set up auth state change listener
                supabase.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        currentUser = session.user;
                        document.getElementById('authSection').classList.add('hidden');
                        document.getElementById('editorContent').classList.remove('hidden');
                        showNotification('Successfully signed in!', 'success');
                        initializeApp();
                        await loadResume();
                    } else if (event === 'SIGNED_OUT') {
                        currentUser = null;
                        document.getElementById('authSection').classList.remove('hidden');
                        document.getElementById('editorContent').classList.add('hidden');
                        showNotification('Signed out', 'success');
                    }
                });

                // If we already have a session, initialize the app
                if (session) {
                    currentUser = session.user;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('editorContent').classList.remove('hidden');
                    initializeApp();
                }

                showNotification('Database connected', 'success');
            } catch (error) {
                console.error('Error initializing Supabase:', error);
                showNotification('Failed to initialize database', 'error');
            }
        }

        // Sign out
        async function signOut() {
            if (isDemoUser) {
                resumeData = {};
                addedSections = ['personalInfo'];
                currentUser = null;
                isDemoUser = false;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('editorContent').classList.add('hidden');
                showNotification('Exited demo mode', 'success');
                return;
            }
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                
                resumeData = {};
                addedSections = ['personalInfo'];
                currentUser = null;
                
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('editorContent').classList.add('hidden');
                
                showNotification('Signed out successfully', 'success');
            } catch (error) {
                console.error('Error signing out:', error);
                showNotification('Error signing out', 'error');
            }
        }
    </script>
</body>
